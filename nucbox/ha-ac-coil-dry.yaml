# Home Assistant automation: an AC that goes from cool or dry to off keeps its coil wet, which is the
# "dirty sock" smell. Run it in fan_only for 30 min to dry the coil, then off. Does not fire on fan_only -> off,
# so it cannot loop with ha-ac-solar-fresh-air.yaml's stop. If the mode changed during the 30 min (the user
# took over, or the solar start/stop acted), it does nothing.
# The start time is recorded in input_text.ac_solar_<room> as {"coil": since} (the same helpers as the solar
# automation, which ignores a record without "mode"), and a check every 5 min (and on HA start) turns the AC off,
# so a restart or reload during the 30 min cannot leave it in fan_only (2026-10-31 the suite ran 65 min).
alias: AC coil dry
description: cool/dry -> off runs fan_only for 30 min (recorded in input_text, survives restarts), then off
triggers:
  - trigger: state
    entity_id: [climate.frente, climate.suite, climate.jardim, climate.escritorio, climate.sala]
    from: [cool, dry]
    to: "off"
    id: dry
  - trigger: time_pattern
    minutes: "/5"
    id: tick
  - trigger: homeassistant
    event: start
    id: tick
actions:
  - variables:
      now_ts: "{{ as_timestamp(now()) | int }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'dry' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ trigger.entity_id }}"
            data:
              hvac_mode: fan_only
          - action: climate.set_fan_mode
            target:
              entity_id: "{{ trigger.entity_id }}"
            data:
              fan_mode: low
          - action: switch.turn_on
            target:
              entity_id: "{{ trigger.entity_id | replace('climate.', 'switch.') }}_mudo"
            continue_on_error: true
          - action: input_text.set_value
            target:
              entity_id: "{{ trigger.entity_id | replace('climate.', 'input_text.ac_solar_') }}"
            data:
              value: "{{ {'coil': now_ts} | to_json }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'tick' }}"
        sequence:
          - repeat:
              for_each: [frente, suite, jardim, escritorio, sala]
              sequence:
                - variables:
                    rec: "{{ states('input_text.ac_solar_' ~ repeat.item) | from_json({}) }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ rec.coil is defined and is_state('climate.' ~ repeat.item, 'fan_only') and now_ts - rec.coil >= 1800 }}"
                      sequence:
                        - action: climate.turn_off
                          target:
                            entity_id: "climate.{{ repeat.item }}"
                        - action: switch.turn_off
                          target:
                            entity_id: "switch.{{ repeat.item }}_mudo"
                          continue_on_error: true
                        - action: input_text.set_value
                          target:
                            entity_id: "input_text.ac_solar_{{ repeat.item }}"
                          data:
                            value: ""
                    # the user (or the solar automation) changed the mode: just forget it
                    - conditions:
                        - condition: template
                          value_template: "{{ rec.coil is defined and not is_state('climate.' ~ repeat.item, 'fan_only') }}"
                      sequence:
                        - action: input_text.set_value
                          target:
                            entity_id: "input_text.ac_solar_{{ repeat.item }}"
                          data:
                            value: ""
mode: queued
max: 10
