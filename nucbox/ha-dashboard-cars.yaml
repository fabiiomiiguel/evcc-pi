            default_zoom: 15
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 5
      - type: grid
        cards:
          - type: heading
            heading: Saúde e manutenção
            icon: mdi:wrench
          - type: tile
            entity: sensor.e208_battery_soh_capacity
            name: Saúde da bateria (capacidade)
          - type: tile
            entity: sensor.e208_battery_soh_resistance
            name: Saúde da bateria (resistência)
          - type: tile
            entity: sensor.e208_battery_capacity
            name: Capacidade
          - type: tile
            entity: sensor.e208_battery_residual
            name: Energia restante
          - type: tile
            entity: sensor.e208_mileage_before_maintenance
            name: Km até à revisão
          - type: tile
            entity: sensor.e208_days_before_maintenance
            name: Dias até à revisão
